[package]
name = "oidc-issuer-config-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
data-encoding = "2.11.0"
http = "1.4.2"
http-body-util = "0.1.3"
humantime = "2.4.0"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = "0.1.20"
k8s-openapi = { version = "0.28.0", default-features = false, features = ["latest"] }
kube = { version = "4.0.0", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
mainline = "7.0.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
